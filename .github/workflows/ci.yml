name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  test-server:
    name: Test Desktop (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and Linux development libraries
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl-dev
      - run: make test-server lint-server

  test-android:
    name: Test Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            app/*.gradle*
            app/gradle/libs.versions.toml

      - name: Run lint
        run: make lint-app

      - name: Run unit tests
        run: make test-app

  build-server:
    name: Build Desktop (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and Linux development libraries
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl-dev
      - run: make release-linux

  build-android:
    name: Build Android
    needs: test-android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            app/*.gradle*
            app/gradle/libs.versions.toml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
