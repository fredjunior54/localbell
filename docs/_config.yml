title: LocalBell
description: >-
  Forward Android notifications to your Linux desktop over your local network.
  Encrypted, private, battery-friendly. No cloud, no accounts, no tracking.
  Open source alternative to Pushbullet and KDE Connect notification mirroring.
url: https://fredjunior54.github.io
baseurl: /localbell
theme: jekyll-theme-minimal

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

author:
  name: Fred Junior
  url: https://github.com/fredjunior54

social:
  name: Fred Junior
  links:
    - https://github.com/fredjunior54

defaults:
  - scope:
      path: ""
    values:
      image: https://raw.githubusercontent.com/fredjunior54/localbell/main/assets/localbell.png
      lang: en
