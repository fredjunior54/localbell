[package]
name = "localbell"
version = "1.4.30"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
getrandom = "0.3"
hex = "0.4"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
zbus = "5"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
